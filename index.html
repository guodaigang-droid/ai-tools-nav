<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{

  --primary:#6366f1;--primary-hover:#4f46e5;--accent:#f0f0ff;--radius:8px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
}
.dark{--bg:#0f0f1a;--surface:#1a1a2e;--border:#2a2a3e;--text:#e5e7eb;--text2:#9ca3af;--accent:#1e1b4b;--shadow:0 1px 3px rgba(0,0,0,.3);--shadow-md:0 4px 12px rgba(0,0,0,.4)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
a{color:inherit;text-decoration:none}

/* Header */
.header{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);backdrop-filter:blur(12px)}
.header-inner{max-width:1280px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;gap:16px}
.logo{font-size:22px;font-weight:800;color:var(--primary);white-space:nowrap;letter-spacing:-0.5px}
.logo span{color:var(--text)}
.search-wrap{flex:1;max-width:480px;position:relative;margin:0 auto}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text2);pointer-events:none}
.search-input{width:100%;padding:10px 14px 10px 42px;border:1px solid var(--border);border-radius:24px;font-size:14px;background:var(--bg);color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
.search-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.search-input::placeholder{color:var(--text2)}
.header-actions{display:flex;align-items:center;gap:8px}
.btn-icon{width:40px;height:40px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s}
.btn-icon:hover{background:var(--bg);border-color:var(--primary)}
.btn-icon.active{background:var(--accent);border-color:var(--primary);color:var(--primary)}
.lang-btn{font-size:13px;font-weight:600;min-width:44px}

/* Main Layout */
.main{max-width:1280px;margin:0 auto;padding:24px}

/* Stats bar */
.stats-bar{display:flex;align-items:center;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.stats-bar .count{font-size:13px;color:var(--text2)}
.stats-bar .count strong{color:var(--primary);font-size:15px}

/* Category tabs */
.cats{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap}
.cat-btn{padding:7px 16px;border:1px solid var(--border);border-radius:20px;background:var(--surface);color:var(--text2);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;white-space:nowrap}
.cat-btn:hover{color:var(--primary);border-color:var(--primary)}
.cat-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Tool grid */
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.tool-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:all .2s;cursor:pointer;position:relative;display:flex;flex-direction:column}
.tool-card:hover{border-color:var(--primary);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.tool-card-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.tool-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex-shrink:0;color:#fff;background:var(--primary)}
.tool-icon.c0{background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.tool-icon.c1{background:linear-gradient(135deg,#ec4899,#f43f5e)}
.tool-icon.c2{background:linear-gradient(135deg,#14b8a6,#0ea5e9)}
.tool-icon.c3{background:linear-gradient(135deg,#f59e0b,#ef4444)}
.tool-icon.c4{background:linear-gradient(135deg,#8b5cf6,#ec4899)}
.tool-icon.c5{background:linear-gradient(135deg,#06b6d4,#3b82f6)}
.tool-icon.c6{background:linear-gradient(135deg,#84cc16,#22c55e)}
.tool-icon.c7{background:linear-gradient(135deg,#f97316,#eab308)}
.tool-info{flex:1;min-width:0}
.tool-name{font-size:15px;font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.tool-name .tag{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:500}
.tag-hot{background:#fef2f2;color:#ef4444}
.tag-new{background:#ecfdf5;color:#10b981}
.tag-free{background:#eff6ff;color:#3b82f6}
.tool-desc{font-size:13px;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tool-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:12px}
.tool-meta .badge{font-size:11px;padding:3px 8px;border-radius:12px;background:var(--bg);color:var(--text2);border:1px solid var(--border);white-space:nowrap}
.tool-meta .badge.cat{background:var(--accent);color:var(--primary);border-color:transparent}

/* No results */
.empty{text-align:center;padding:60px 20px;color:var(--text2)}
.empty svg{width:64px;height:64px;margin-bottom:16px;color:var(--border)}
.empty h3{font-size:16px;margin-bottom:4px;color:var(--text)}

/* Footer */
.footer{text-align:center;padding:32px 24px;color:var(--text2);font-size:13px;border-top:1px solid var(--border);margin-top:40px}
.footer a{color:var(--primary)}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:10px 24px;border-radius:24px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* Banner */
.banner{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-radius:12px;padding:28px 32px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.banner h2{font-size:18px;font-weight:700}
.banner p{font-size:14px;opacity:.9;margin-top:4px}
.banner .btn-submit{padding:10px 24px;background:#fff;color:#6366f1;border:none;border-radius:24px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.banner .btn-submit:hover{transform:scale(1.03);box-shadow:0 4px 16px rgba(0,0,0,.2)}

@media(max-width:768px){
  .header-inner{padding:0 16px;height:56px}
  .logo{font-size:18px}
  .search-wrap{max-width:none}
  .main{padding:16px}
  .tool-grid{grid-template-columns:1fr}
  .banner{flex-direction:column;text-align:center;padding:20px}
  .cats{gap:4px}
  .cat-btn{padding:6px 12px;font-size:12px}

/* Particles */
#particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.4}
/* Header glow */
.header{border-bottom:1px solid var(--border);box-shadow:0 0 30px rgba(99,102,241,.08)}
.header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--primary),transparent);opacity:.6}

/* Tool icon styles */
.tool-icon-img{width:44px;height:44px;border-radius:10px;flex-shrink:0;object-fit:contain;background:var(--bg);padding:4px}
.tool-icon-fallback{width:44px;height:44px;border-radius:10px;display:none;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex-shrink:0;color:#fff}
.tool-icon-img[style*="display:none"] + .tool-icon-fallback,.tool-icon-img:not([src]),.tool-icon-img[src=""]{display:none!important}
.tool-icon-img[style*="display:none"] + .tool-icon-fallback{display:flex!important}
/* Visitor counter */
.visitor-counter{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:8px;font-size:13px;color:var(--text2)}
.visitor-count{font-weight:700;color:var(--primary);font-size:15px;font-variant-numeric:tabular-nums}
.visitor-icon{font-size:16px}
/* Banner glow */
.banner{position:relative;overflow:hidden}
.banner::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 50%,rgba(255,255,255,.06) 0%,transparent 60%);pointer-events:none}
/* Card hover glow */
.tool-card:hover{box-shadow:0 4px 24px rgba(99,102,241,.12),0 0 0 1px var(--primary)}

</style>
</head>

let lang = 'zh';
let activeCat = null;
let theme = 'light';

// ==================== RENDER ====================
function setLang(l){lang=l;document.getElementById('langZh').classList.toggle('active',l==='zh');document.getElementById('langEn').classList.toggle('active',l==='en');document.querySelectorAll('[data-zh]').forEach(el=>{const t=el.getAttribute('data-'+l);if(t){if(el.tagName==='INPUT'){el.placeholder=t;}else{el.textContent=t;}}});
// Visitor counter using CountAPI
async function updateVisitorCount(){
  const el=document.getElementById('visitorCount');
  try{
    const ns='aitoolnav-tools';
    const key='visits';
    await fetch('https://api.countapi.xyz/hit/'+ns+'/'+key,{method:'GET'});
    const res=await fetch('https://api.countapi.xyz/get/'+ns+'/'+key);
    const data=await res.json();
    if(data&&data.value)el.textContent=data.value.toLocaleString();
  }catch(e){
    // Fallback to localStorage
    let count=parseInt(localStorage.getItem('aitoolnav_visits')||'1');
    if(!sessionStorage.getItem('aitoolnav_counted')){
      count++;localStorage.setItem('aitoolnav_visits',count);
      sessionStorage.setItem('aitoolnav_counted','1');
    }
    el.textContent=count.toLocaleString();
  }
}
updateVisitorCount();
render();}

function toggleTheme(){
  theme = theme==='light'?'dark':'light';
  document.body.classList.toggle('dark',theme==='dark');
  document.getElementById('sunIcon').style.display = theme==='dark'?'none':'';
  document.getElementById('moonIcon').style.display = theme==='dark'?'':'none';
  localStorage.setItem('aitools-theme',theme);
}

function render(){
  const search = document.getElementById('search').value.toLowerCase();
  let filtered = TOOLS;
  if(activeCat !== null) filtered = filtered.filter(t=>t.cat===activeCat);
  if(search) filtered = filtered.filter(t=>t.n[lang].toLowerCase().includes(search)||t.d[lang].toLowerCase().includes(search)||(t.tags||[]).some(tg=>tg.toLowerCase().includes(search)));

  document.getElementById('toolCount').textContent = filtered.length;
  const grid = document.getElementById('toolGrid');
  grid.innerHTML = filtered.map((t,i)=>{
    const tags = (t.tags||[]).map(tg=>{
      const cls = tg==='hot'?'tag-hot':tg==='new'?'tag-new':tg==='free'?'tag-free':'';
      const label = tg==='hot'?(lang==='zh'?'热门':'Hot'):tg==='new'?(lang==='zh'?'新品':'New'):tg==='free'?(lang==='zh'?'免费':'Free'):tg;
      return `<span class="tag ${cls}">${label}</span>`;
    }).join('');
    const cat = CATS.find(c=>c.id===t.cat);
    return `<a class="tool-card" href="${t.url}" target="_blank" rel="noopener" onclick="trackClick('${t.id}')">
      <div class="tool-card-top">
        <img class="tool-icon-img" src="https://www.google.com/s2/favicons?domain=${new URL(t.url).hostname}&sz=64" onerror="this.style.display='none'" alt="" loading="lazy"><div class="tool-icon-fallback c${i%8}">${cat?cat.icon:'🔧'}</div>
        <div class="tool-info">
          <div class="tool-name">${t.n[lang]} ${tags}</div>
          <div class="tool-desc">${t.d[lang]}</div>
        </div>
      </div>
      <div class="tool-meta">
        <span class="badge cat">${cat?cat.n[lang]:''}</span>
        ${t.aff?`<span class="badge">${lang==='zh'?'联盟返佣':'Affiliate'}</span>`:''}
      </div>
    </a>`;
  }).join('');

  // Cats
  document.getElementById('cats').innerHTML = [
    `<button class="cat-btn ${activeCat===null?'active':''}" onclick="selectCat(null)">${lang==='zh'?'全部':'All'}</button>`,
    ...CATS.map(c=>`<button class="cat-btn ${activeCat===c.id?'active':''}" onclick="selectCat(${c.id})">${c.icon} ${c.n[lang]}</button>`)
  ].join('');

  document.getElementById('empty').style.display = filtered.length ? 'none' : '';
}

function selectCat(id){activeCat=id;render();}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}


// Particle starfield
(function(){
  const c=document.getElementById('particles'),ctx=c.getContext('2d');
  let w,h,particles=[];
  function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}
  resize();window.addEventListener('resize',resize);
  for(let i=0;i<60;i++)particles.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5+.3,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,o:Math.random()*.5+.2});
  function anim(){
    ctx.clearRect(0,0,w,h);
    const isDark=document.body.classList.contains('dark');
    particles.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=w;if(p.x>w)p.x=0;if(p.y<0)p.y=h;if(p.y>h)p.y=0;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=isDark?'rgba(255,255,255,'+p.o+')':'rgba(99,102,241,'+p.o+')';
      ctx.fill();
    });
    requestAnimationFrame(anim);
  }
  anim();
  // Redraw on theme toggle
  new MutationObserver(()=>{}).observe(document.body,{attributes:true,attributeFilter:['class']});
})();

// Init
document.getElementById('search').addEventListener('input',render);
const saved = localStorage.getItem('aitools-theme');
if(saved==='dark') toggleTheme();
render();
